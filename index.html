/* figures and worked lines sit on a quiet panel in the page's own mode, so every role is the same color in prose,
   equations and graphs (the board of the Slate theme flips polarity; this theme does not) */
.workbox,.pfig,.overview,.gwrap,.partsfig,.board,.gv{--bg:var(--panel);--surface:var(--panel);background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.pfig,.overview,.gwrap,.partsfig,.gv{border-radius:12px;padding:12px}

/* colored text always means a math role, so links are ink with an accent rule beneath, never role-blue text */

/* Colors and fonts come from the course theme (interactive/themes/<name>.css), injected by build.py. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:21px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--inside);text-underline-offset:3px}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

.col{max-width:760px;margin-left:auto;margin-right:auto}
p{margin:0 0 16px;text-wrap:pretty}

.mn.in,.mv.in,.mf.in,.mo.in{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-skip-ink:none}

.out{color:var(--outside)}
.k{color:var(--ink) !important;background:var(--k-tint);box-shadow:inset 0 -1.5px 0 var(--k-line);border-radius:4px;padding:0 .14em;margin:0 .02em;font-weight:500;text-decoration:none !important}
sup.k{padding:0 .1em}

.brand{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);text-decoration:none}
.toc{display:flex;gap:20px;flex:1;justify-content:center;font-family:var(--sans);font-size:16px}
.toc a{color:var(--muted);text-decoration:none;padding:6px 0}

.rulesbtn{margin-left:auto;font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;min-height:42px;padding:6px 18px;cursor:pointer;display:flex;gap:8px;align-items:center;position:relative;z-index:22}

.scrim{position:fixed;inset:0;z-index:21;background:transparent;border:0;padding:0;margin:0;cursor:default}
.drawer{position:absolute;right:0;top:calc(100% + 8px);z-index:23;width:min(460px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:0 18px 50px rgba(20,18,12,.18)}
.rules{list-style:none;margin:0;padding:0}

.rules li:first-child{border-top:0}
.rname{font-family:var(--sans);font-size:16px;color:var(--muted)}
.rules li.new .rname{color:var(--ink);font-weight:600}

/* hero */

.emblem{margin:52px 0 0;padding:44px 20px 32px;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:26px}
.emb-row{font-family:var(--serif);font-size:clamp(56px,11vw,108px);line-height:1.1;display:flex;align-items:flex-start}

.sec{padding-top:160px;margin-bottom:12px}

.btn{font-family:var(--sans);font-size:17px;font-weight:600;min-height:48px;padding:10px 20px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}

.prob,.scard,.exam{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px 36px 30px;margin:44px auto 0;max-width:760px}
.prob-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:18px}
.plabel{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--muted)}

.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lhs{font-size:24px;white-space:nowrap}
.minput{flex:1 1 200px;min-width:0;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;min-height:54px;padding:10px 14px;width:100%}

/* keys are 52 px wide or more where there is room; in a narrow row they shrink so all seven still fit on one line */

.key:hover{border-color:var(--ink)}
.fb{font-family:var(--sans);font-size:17px;line-height:1.55;margin-top:10px}

.pv{font-family:var(--sans);font-size:16px;color:var(--muted);margin-top:6px}

.fb-no::before,.fb-err::before,.fb-stuck::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--outside);margin-right:9px;vertical-align:2px}

.aft{display:flex;gap:10px;flex-wrap:wrap}

.ctitle{font-family:var(--sans);font-size:19px;margin:0 0 18px}

.ctitle .ms{font-size:19px}
.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:28px minmax(0,10em) minmax(0,1fr);gap:8px 18px;align-items:start;padding:20px 0;border-top:1px solid var(--line)}
.srow.fixrow{grid-template-columns:28px minmax(0,9em) minmax(0,1fr) 120px}
.snum{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--muted);padding-top:15px}
.slabel{font-family:var(--sans);font-size:18px;line-height:1.35;padding-top:13px}

.vrow > .sbox,.vrow > .minput{flex:1 1 auto;min-width:0}
.sbox{display:block;font-size:clamp(18px,2.9vw,24px);white-space:nowrap;overflow-x:auto;line-height:1.45;min-height:54px;padding:8px 16px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;width:100%;text-align:left;color:var(--ink)}

.bmark{width:22px;flex:none;color:var(--ok);font-weight:700;font-family:var(--sans);padding-top:14px}

.hl-stage{padding:34px 26px 32px;text-align:center}

.chip{font-size:26px;min-height:62px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}

/* rule */
.rule{margin:44px 0 0;padding:48px 32px 40px;background:var(--surface);border:2px solid var(--ink);border-radius:18px;text-align:center;position:relative}

.memo span::after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid var(--outside)}
.rule-eq{white-space:nowrap;overflow-x:auto;font-size:clamp(19px,4.4vw,42px);line-height:1.4;padding:22px 12px;background:var(--bg);border-radius:12px}

/* why */
.whyd{margin:44px auto 0;max-width:760px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 24px}
.whyd summary,.hintd summary{list-style:none}

.opt{font-weight:400;color:var(--muted)}
.chev{margin-left:auto;width:12px;height:12px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s;flex:none}
details[open] > summary .chev{transform:translateY(3px) rotate(225deg)}
.hintd summary{gap:10px}
.hintd summary .chev{margin-left:0;width:9px;height:9px;border-width:2px}

/* forms */
.forms{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 26px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:26px}
.frow:first-child{border-top:0}
.fl{text-align:right}

/* exam */
.exam-q{font-size:23px}
.msol{margin:16px 0 0;padding-left:1.3em;font-size:21px}
.msol li{margin-bottom:10px}
.self{border:1px solid var(--line);border-radius:12px;padding:12px 18px 8px;margin:20px 0 0}
.self legend{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted);padding:0 6px}
.ck{display:flex;align-items:center;gap:12px;min-height:46px;font-family:var(--sans);font-size:18px;cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--ink);flex:none}
/* close */
.closer h3{font-size:28px;margin:8px 0 14px}
.closer .rules{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 22px}
.reads{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:20px}
.reveal{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lift{0%{background:transparent}40%{background:var(--inside-tint);box-shadow:0 0 0 6px var(--inside-tint)}100%{background:var(--inside-tint)}}
@keyframes fadein{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media (max-width:860px){.toc{display:none}}
@media (max-width:900px){.srow,.srow.fixrow{grid-template-columns:24px minmax(0,1fr)}.snum{padding-top:2px}.slabel{padding-top:0}.sval,.fixcol{grid-column:2}.fixbtn{width:auto}}
@media (max-width:640px){
body{font-size:19px}

}

/* ================= v2 (F01, 2026-10-10) =================
   Engine-generic rules that used to live in Unit 2's page.css, copied verbatim and in their original order,
   so every page gets fractions, choices, cards, tables and the Memorize box without a page.css of its own. */
/* stacked fractions: inline-block in ordinary flow, never flex or grid */
.fr{display:inline-block;vertical-align:middle;text-align:center;line-height:1.08;margin:0 .1em;font-size:.86em}

.fr > .fd{padding-top:.06em}

.fr.op{font-size:.8em}
.fr .mv{padding-right:0}
.dd{font-style:normal}
.rt{color:var(--rate);font-weight:600}
.k .fr{background:transparent}
.ml{white-space:nowrap}
.mline{display:block;white-space:nowrap;padding:3px 0}
.mline + .mline{border-top:1px dashed var(--line)}
.marr{display:block;color:var(--muted);font-family:var(--sans);font-size:15px;line-height:1;padding:2px 0 2px 6px}
/* emblem */
.emb-math{font-size:clamp(30px,6.4vw,64px);line-height:1.5;white-space:nowrap;text-align:center}
.emb-sub{font-size:clamp(19px,3.4vw,30px);color:var(--muted);text-align:center;padding:0 8px}
.sw-rate{background:var(--rate-tint);border-bottom:3px solid var(--rate)}
.sw-k{background:var(--k-tint);border-bottom:3px solid var(--k-line)}
.leg-rate b{color:var(--rate)}
/* choice lists */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.choice{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:20px;line-height:1.45;min-height:56px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choice:hover{border-color:var(--ink)}
.choice.picked-ok{border-color:var(--ok);background:var(--ok-tint)}
.choice.picked-no{border-color:var(--outside);border-style:dashed}
.choice:disabled{cursor:default}
.choice .mn,.choice .mv,.choice .mf,.choice .mo{font-size:22px}
.sbox.multi{white-space:normal;overflow-x:auto}
.why{font-family:var(--sans);font-size:15px;color:var(--muted);margin-top:6px}
.why .mn,.why .mv,.why .mf,.why .mo{font-size:17px}
.mcrow{display:flex;flex-direction:column;gap:8px}
.mcrow .choice{min-height:52px;font-size:20px;padding:8px 14px}
.ptext{font-size:22px;line-height:1.5;margin:0 0 18px}
.pfig{margin:0 0 18px}
.pfig svg{display:block;width:100%;max-width:320px;height:auto;margin:0 auto}
.pfig svg text{fill:var(--ink)}
@media (max-width:640px){.ptext{font-size:20px}.choice{font-size:19px}}
.k + sup.ms{margin-left:-.06em}
svg text{font-family:var(--serif);fill:var(--ink)}
svg .lab{font-style:normal;font-size:19px}
svg .num{font-size:16px;fill:var(--muted)}
.marr{font-size:19px;padding:2px 0 2px 10px}
.ml.nb .eq{white-space:nowrap}
.marr{font-size:22px;padding:2px 0 2px 18px}
.ml.nb{display:inline-block}
.in{color:var(--inside)}
span.in{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-skip-ink:none}
.fr span.in{text-underline-offset:3px}
.out{color:var(--outside)}
.sw-out2{background:var(--outside-tint);border-bottom:3px solid var(--outside)}
.emb-math{font-size:clamp(26px,5.6vw,52px)}
.emb-sub{max-width:28em;margin:0 auto}
.disp{text-align:center;font-size:clamp(28px,5vw,40px);margin:18px 0 8px}
.ctitle{font-family:var(--sans);font-size:17px;font-weight:700;color:var(--muted);margin:0 0 14px}
.ctitle .mn,.ctitle .mv,.ctitle .mo,.ctitle .pr{font-size:19px;font-weight:400}
.workbox{font-size:clamp(18px,2.9vw,23px);padding:12px 18px}
.workbox .mline{padding:6px 0}
.note.small,.small-sans{font-family:var(--sans);font-size:16px;color:var(--muted)}

.ans-end{display:inline-flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}

/* ---------- v2 notation (lesson-core.js mth) ---------- */
.mn.me{font-style:normal}
.msb{font-size:.7em;line-height:1;vertical-align:-.3em}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;line-height:1.15;margin-right:.2em}
.lim-s{font-size:.6em;line-height:1;white-space:nowrap;margin-top:.02em}
.lim-s .ms{font-size:.85em;vertical-align:.5em}
.int{white-space:nowrap;margin-right:.1em}
.int-s{font-family:var(--math);font-size:1.7em;line-height:1;vertical-align:-.28em;font-style:normal}
.int-l{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:flex-start;vertical-align:middle;height:2.9em;font-size:.6em;line-height:1;margin-left:-.05em}
.int-b{margin-top:-.35em}.int-a{margin-bottom:-.5em;margin-left:-.35em}
.sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .14em}
.sum-s{font-family:var(--math);font-size:1.5em;line-height:1}
.sum-a,.sum-b{font-size:.6em;white-space:nowrap;line-height:1.1}
.evb{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:flex-start;vertical-align:middle;height:3.1em;font-size:.6em;line-height:1;border-left:.13em solid currentColor;padding-left:.22em;margin-left:.12em}
.abs > .mn:first-child{padding-right:.05em}.abs > .mn:last-child{padding-left:.05em}
.dif .mv{padding-right:0}
.fr .lim,.fr .int{font-size:1em}
.mf.fs{padding-right:.2em}
/* scripts under lim, beside ∫, around Σ and on the bar keep their small size even where a container fixes math spans in px */
.lim-s *,.int-l *,.sum-a *,.sum-b *,.evb *,sub.msb *{font-size:inherit !important}
/* v2 pages (mount without legacy): superscripts stay small inside choices, feedback, hints and card titles */
.v2 sup.ms *{font-size:inherit !important}
.v2 .ctitle .ms{font-size:.7em}
.rule-line{display:block}

/* ---------- v2 components (components.js) ---------- */
/* SharedBadge, card header */
.shared-badge{display:inline-flex;align-items:center;font-family:var(--sans);font-size:14px;font-weight:700;line-height:1.3;color:var(--ink);background:var(--k-tint);border:1.5px solid var(--k-line);border-radius:999px;padding:4px 12px}
.ctop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 14px}
.ctop .ctitle{margin:0}
/* VariationCard */
.vc-idea{font-family:var(--sans);font-size:17px;color:var(--muted);margin:-6px 0 8px}
.vc-count{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted);margin:0 0 6px}
.vc-list{list-style:none;counter-reset:vc;margin:0;padding:0}
.vc-item{counter-increment:vc;position:relative;padding:22px 0 8px 42px;border-top:1px solid var(--line)}
.vc-item::before{content:counter(vc);position:absolute;left:0;top:22px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--sans);font-size:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.vc-item.done::before{content:'\2713';color:var(--ok);border-color:var(--ok);background:var(--ok-tint)}
.vc-item .ptext{font-size:20px}
/* Matcher */
.mt-how{font-family:var(--sans);font-size:16px;color:var(--muted);margin:0 0 12px}
.mt-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:var(--serif);font-size:19px;line-height:1.4;min-height:56px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mt-i:hover{border-color:var(--ink)}
.mt-i.sel{border-color:var(--inside);box-shadow:0 0 0 3px var(--inside-tint)}
.mt-i.done{border-color:var(--ok);background:var(--ok-tint);cursor:default}
.mt-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:var(--bg);font-family:var(--sans);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mt-body{flex:1 1 auto;min-width:0}
.mt-body svg{display:block;width:100%;max-width:220px;height:auto;margin:0 auto}
.mt-body svg text{fill:var(--ink);font-family:var(--math);font-size:15px}
.mt-count{font-family:var(--sans);font-size:15px;color:var(--muted);margin:12px 0 0}
/* Slider and Toggle */
.sl{margin:14px 0 8px}
.sl-lab{display:block;font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink);margin-bottom:2px}
.sl-lab .mn,.sl-lab .mv,.sl-lab .mo{font-size:19px}
.sl-row{display:flex;align-items:center;gap:14px}
.sl-in{flex:1 1 auto;min-width:0;height:44px;accent-color:var(--inside);margin:0}
.sl-out{flex:none;min-width:4.2em;text-align:right;font-family:var(--math);font-size:21px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tg .zb .mn,.tg .zb .mv,.tg .zb .mo{font-size:17px}
/* GraphView (the theme puts .gv on the board) */
.gv{margin:0 0 18px;border-radius:12px;padding:12px}
.gv svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto;overflow:visible}
.gv svg text{fill:var(--ink);font-size:16px}
.gv svg text.num{fill:var(--muted)}
.gv svg text.n{font-family:var(--math)}
.gv svg .gv-lab{font-size:16px}
.gv svg .gv-sign{font-size:22px;font-weight:700;fill:var(--ink)}
.gv-drag{cursor:grab;outline:none;touch-action:none}
.gv-drag:focus-visible .gv-dot,.gv-drag:focus .gv-dot{stroke:var(--focus);stroke-width:4}
.gv-read{font-family:var(--sans);font-size:17px;text-align:center;margin:10px 0 0;min-height:1.6em}
.gv-read .mn,.gv-read .mv,.gv-read .mo,.gv-read .mf,.gv-read .pr{font-size:21px}
.gv-cap{font-family:var(--sans);font-size:16px;color:var(--muted);margin:8px 0 0}
.gv .zoombtns{justify-content:center}
/* TableBuilder */
.tb-wrap{overflow-x:auto;margin:18px 0 0;max-width:100%}
.avt.tb{width:auto;min-width:min(100%,300px)}

<body>
<div class="page" id="app"></div>
<script>
/*
 * mathkit.js: the math engine from the chain rule page, usable on its own.
 *
 * Works in the browser (window.MathKit) and in Node (require('./mathkit.js')).
 *
 *   const mk = new MathKit();
 *   mk.same(mk.cf('15(3x+1)^4'), mk.cf('5(3x+1)^4*3'))      // true: equivalence by sampling
 *   mk.parse('sin x^2')                                      // tree, or {err: 'friendly message'}
 *   mk.pr(mk.simp(mk.diff(mk.parse('ln(x^2+4)').ast)), 'x').s   // '1/(x^2 + 4) * 2x'
 *   mk.rich('Find `f(x) = «(»{3x + 1}«)^5»` at `x = ‹2›`')  // typeset segments (see math-typesetting.md)
 *   mk.judge({ ans: '2x', wrongs: [['x^2', 'forgot to differentiate']] }, studentText)
 *
 * CLI (validate answer keys while authoring):
 *   node mathkit.js same "15(3x+1)^4" "5(3x+1)^4*3"
 *   node mathkit.js diff "sqrt(ln(x^2+5))"
 *   node mathkit.js parse "e^2x"          # shows how an ambiguous input is read
 *
 * Scope: one variable, + - * / ^, implicit multiplication, sin cos tan sec csc cot
 * arcsin arccos arctan ln log sqrt exp abs, |..| absolute value bars, e, pi.
 * Equivalence is numeric: two expressions agree at 10 sample points (relative tolerance
 * 1e-6, at least 3 points where both are defined). Good for answer checking; not a proof.
 *
 * The variable (v2, 2026-10-10). The second argument to tok/parse/compile/cf is either
 *   - nothing or false: the variable is x;
 *   - true: the variable is u (kept for older pages);
 *   - a letter, such as 't': the variable is that letter;
 *   - an object { v: 't', params: ['c', 'y'] }: the variable is v, and each letter in params
 *     is read as a named constant whose value is supplied at evaluation time:
 *     compile(src, o).f(x, { c: 1, y: 2 }). Missing params evaluate to 0.
 * Input is lowercased first, so params and variables are lowercase letters.
 */
class MathKit {
  constructor() { this.fcache = {}; this.rcache = {}; this.D = { VOC: {} }; }
  /* normalize the variable option (see the header) */
  vo(uv) {
    if (uv && typeof uv === 'object') return { v: String(uv.v || 'x').toLowerCase(), params: (uv.params || []).map((p) => String(p).toLowerCase()) };
    if (typeof uv === 'string' && uv) return { v: uv.toLowerCase(), params: [] };
    return { v: uv ? 'u' : 'x', params: [] };
  }
  /* ---------- math reading: text to tree ---------- */
  tok(src, uv) {
    let bar = 0;
    const s = String(src).replace(/[−–—]/g, '-').replace(/[·×∙⋅]/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4').replace(/\*\*/g, '^').replace(/[\[{]/g, '(').replace(/[\]}]/g, ')')
      .replace(/\|/g, () => (bar++ % 2 === 0 ? ' (abs(' : '))')).toLowerCase();
    if (bar % 2) return { err: 'An absolute value bar “|” is missing its partner.' };
    const W = ['sqrt', 'arcsin', 'arccos', 'arctan', 'sin', 'cos', 'tan', 'sec', 'csc', 'cot', 'exp', 'abs', 'ln', 'log', 'pi'];
    const o = this.vo(uv), vname = o.v;
    const out = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (c === vname) { out.push({ t: 'x' }); i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const t = s.slice(i, j);
        if (t === '.' || (t.match(/\./g) || []).length > 1) return { err: 'The number “' + t + '” has a stray decimal point.' };
        out.push({ t: 'num', v: parseFloat(t) });
        i = j;
        continue;
      }
      if (/[a-z]/.test(c)) {
        const w = W.find((k) => s.startsWith(k, i));
        if (w) { i += w.length; if (w === 'pi') out.push({ t: 'pi' }); else out.push({ t: 'fn', v: w === 'log' ? 'ln' : w }); continue; }
        if (c === 'e') { out.push({ t: 'e' }); i++; continue; }
        if (o.params.indexOf(c) >= 0) { out.push({ t: 'p', v: c }); i++; continue; }
        if (vname === 'u' && c === 'x') return { err: 'Write this row using u, not x. Here u stands for the whole inside.' };
        return { err: 'This box uses ' + vname + ' as its only variable, so “' + c + '” is not something it can read.' };
      }
      if ('+-*/^()'.indexOf(c) >= 0) { out.push({ t: c }); i++; continue; }
      return { err: 'The symbol “' + c + '” is not something this box can read.' };
    }
    return { toks: out };
  }

  parse(src, uv) {
    if (!src || !String(src).trim()) return { empty: true };
    const r = this.tok(src, uv);
    if (r.err) return { err: r.err };
    const T = r.toks;
    let i = 0;
    const peek = () => T[i];
    const vn = this.vo(uv).v;
    const isF = (t) => !!t && (t.t === 'num' || t.t === 'x' || t.t === 'p' || t.t === 'e' || t.t === 'pi' || t.t === 'fn' || t.t === '(');
    const show = (t) => (t.t === 'fn' || t.t === 'p' ? t.v : t.t === 'num' ? String(t.v) : t.t === 'x' ? vn : t.t);
    const fail = (m) => { throw new Error(m); };
    const B = (k, a, b) => ({ k, a, b });
    let expr, term, unary, power, primary;
    expr = () => {
      let a = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { const op = T[i++].t; a = B(op, a, term()); }
      return a;
    };
    term = () => {
      let a = unary();
      for (;;) {
        const t = peek();
        if (t && (t.t === '*' || t.t === '/')) { i++; a = B(t.t, a, unary()); }
        else if (isF(t)) a = B('*', a, power());
        else break;
      }
      return a;
    };
    unary = () => {
      const t = peek();
      if (t && t.t === '-') { i++; return { k: 'neg', a: unary() }; }
      if (t && t.t === '+') { i++; return unary(); }
      return power();
    };
    power = () => {
      const b = primary();
      if (peek() && peek().t === '^') {
        i++;
        let e;
        if (peek() && peek().t === '-') { i++; e = { k: 'neg', a: power() }; } else e = power();
        return B('^', b, e);
      }
      return b;
    };
    primary = () => {
      const t = T[i];
      if (!t) fail('The expression ends too soon. Something is missing at the end.');
      if (t.t === 'num') { i++; return { k: 'n', v: t.v }; }
      if (t.t === 'x') { i++; return { k: 'v' }; }
      if (t.t === 'p') { i++; return { k: 'p', name: t.v }; }

/* components.js: shared components for Rize lesson pages, any course (v2, 2026-10-10; step rail and annotations 2026-10-25).

/* fmtNum(v): up to 6 decimals, trailing zeros dropped; fmtNum(v, 3): exactly 3 decimals; fmtNum(v, 3, true): at most 3 */
function fmtNum(v, dp, trim) { if (typeof v === 'string') return v.replace(/^-/, '−'); var s = (dp === undefined ? String(Math.round(v * 1e6) / 1e6) : v.toFixed(dp)); if (trim && s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, ''); if (/^-0(\.0*)?$/.test(s)) s = s.slice(1); return s.replace(/^-/, '−'); }

/* faded(id, { title, intro, rows: [{ show: 'math' } | { item: 'id' }], gate: true, shared }): a worked example whose
   later rows are typed; with gate (the default) each typed row opens only after the one before is correct */
function faded(id, o) {
  var rows = o.rows, gate = o.gate !== false, out = '', blocked = false, ids = rows.filter(function (r) { return r.item; }).map(function (r) { return r.item; });
  ids.forEach(function (rid, k) { if (ITEMS[rid]) ITEMS[rid].nextId = ids[k + 1] || null; });

/* ---------------- 3. TableBuilder ---------------- */
/* table(id, { caption, cols: ['`x`', '`f(x)`'], rows: [[1.9, '3.900'], [1.99, { item: 't-199' }], ...], dir: 'down' | 'across',
   highlight: 'last' | [row indexes], rowHead: true }) inside blk(name, ...); typed cells' items use that block name.
   A cell is a number or numeric string (decimal-aligned), a string with `math`, { item: id } (a typed answer),
   { echo: id, empty: 'your answer from above' } (repeats what the student typed in item id), or { html: '...' }. */
var TBS = {};
var NUMRE = /^\s*[−-]?\d*\.?\d+\s*$/;
function tbIsNum(c) { return typeof c === 'number' || (typeof c === 'string' && NUMRE.test(c)); }
function tbSplit(c) { var s = typeof c === 'number' ? String(c) : c.trim(); s = s.replace(/^-/, '−'); var p = s.split('.'); return [p[0], p.length > 1 ? '.' + p[1] : '']; }
function echoHTML(id, empty) { var v = S.ans[id] && S.ans[id].trim(); return v ? '<span class="mine">' + esc(v) + '</span>' : '<span class="tbd">' + esc(empty || 'your answer from above') + '</span>'; }
function table(id, o) {
  TBS[id] = o;

  /* column widths for decimal alignment (in ch), over the numeric cells of each data column */
  var wi = [], wf = [];
  for (var c = 0; c < ncol; c++) { wi[c] = 0; wf[c] = 0; rows.forEach(function (r) { if (tbIsNum(r[c])) { var sp = tbSplit(r[c]); wi[c] = Math.max(wi[c], sp[0].length); wf[c] = Math.max(wf[c], sp[1].length); } }); }
  function cell(x, c) {
    if (x === undefined || x === null) return '';
    if (tbIsNum(x)) { var sp = tbSplit(x); return '<span class="dn"><span class="dn-i" style="min-width:' + wi[c] + 'ch">' + sp[0] + '</span><span class="dn-f" style="min-width:' + wf[c] + 'ch">' + sp[1] + '</span></span>'; }
    if (typeof x === 'string') return P(x);
    if (x.item) { var it2 = ITEMS[x.item]; return '<span class="tb-cell"><input class="minput tb-in" id="in-' + x.item + '" data-id="' + x.item + '" value="' + esc(S.ans[x.item] || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="decimal" aria-label="' + esc(it2.label || it2.ask || 'Your answer') + '">' +
      '<button type="button" class="btn sm tb-chk" data-act="check" data-id="' + x.item + '">Check</button>' + (S.done[x.item] ? '<span class="tb-ok" aria-hidden="true">✓</span>' : '') + '</span>'; }
    if (x.echo) return '<span data-echo="' + x.echo + '" data-empty="' + esc(x.empty || '') + '">' + echoHTML(x.echo, x.empty) + '</span>';
    if (x.html) return x.html;
    return esc(String(x));
  }
  var hl = function (r) { return o.highlight === 'last' ? r === rows.length - 1 : (o.highlight || []).indexOf(r) >= 0; };

      { lead: 'Is `(1, 0)` an eigenvector?', ok: 0, pick: [
        ['No, because `(2, 4)` is not a multiple of `(1, 0)`', 'The arrow at `(1, 0)` points off the `x`-axis, so a solution starting there curves away from it.'],
        ['Yes, with `λ = 2`, from the first entries', 'A multiple of `(1, 0)` has second entry 0, and `(2, 4)` has 4. Both entries must match.', T_EIGL],

  /* 4. eigenvalues from det(A − λI) = λ² − Tλ + D */
  { id: 'p4', sec: 'sec-eig', task: 'Find the eigenvalues of `A`. Problems 5 and 6 use this matrix again.',
    board: ['x′ = −2x + 2y', 'y′ = x − 3y', 'A = [[−2, 2; 1, −3]]'], v: 't', teach: T_EIG,
    steps: [
      { lead: 'Subtract `λ` and take the determinant. Which is `"det"(A − λI)`?', ok: 1, pick: [
        ['`(−2 − λ)(−3 − λ)` `− (2 − λ)(1 − λ)`', '`λI` has `λ` on the diagonal only, so the entries 2 and 1 stay as they are.', T_EIG],
        ['`(−2 − λ)(−3 − λ) − (2)(1)`', '`λ` comes off the two diagonal entries only, and the determinant is `(a − λ)(d − λ) − bc`.'],
        ['`(−2 − λ)(−3 − λ) + (2)(1)`', 'The determinant subtracts `bc`: `(a − λ)(d − λ) − bc`.', T_EIG],
        ['`(−2 − λ)(1) − (2)(−3 − λ)`', 'Multiply the two diagonal entries, `(a − λ)(d − λ)`, then subtract the product of the other two, `bc`.', T_EIG]] },
      { lead: 'Multiply out. The result has the form `λ^2 − Tλ + D`, with the trace `T = a + d` and `D = ad − bc`.', ask: 'T =', num: true, ans: '-5',
        sol: ['`T = −2 + (−3) = −5`'],
        wrongs: [['5', '`T = a + d = −2 + (−3)`, which is negative. The polynomial shows `+5λ` because of the minus sign in `−Tλ`.'],
          ['6', 'That is the product of the diagonal entries. The trace is their sum, `−2 + (−3)`.']],
        hints: ['Add the two diagonal entries, `−2` and `−3`.'] },
      { ask: 'D =', num: true, ans: '4', sol: ['`D = (−2)(−3) − (2)(1) = 6 − 2 = 4`'],
        wrongs: [['8', '`D = ad − bc` subtracts `bc = 2`: `6 − 2`.', T_EIG],
          ['6', 'That is `ad` alone. Subtract `bc = 2 · 1` as well.'],
          ['-4', 'Two negatives multiply to a positive: `ad = (−2)(−3) = 6`.']],
        hints: ['Work out `ad = (−2)(−3)` and `bc = (2)(1)`, then subtract.'] },
      { show: '"det"(A − λI) = λ^2 + 5λ + 4' },
      { lead: 'Solve `λ^2 + 5λ + 4 = 0`. Type both eigenvalues, with a comma between them.', ask: 'λ =', list: true, num: true, ans: '-1, -4',
        sol: ['`λ^2 + 5λ + 4 = (λ + 1)(λ + 4) = 0`, so `λ = −1` or `λ = −4`'],
        wrongs: [['1, 4', 'Check the signs: `λ^2 + 5λ + 4 = (λ + 1)(λ + 4)`, which is 0 at `λ = −1` and at `λ = −4`.'],
          ['-2, -3', 'Those are the diagonal entries. They are the eigenvalues only when `b` or `c` is 0. Solve `λ^2 + 5λ + 4 = 0`.', T_EIG],
          ['-5, 4', 'Those are `T` and `D`. The eigenvalues are the roots of `λ^2 + 5λ + 4`.']],
        hints: ['Look for two numbers that multiply to 4 and add to 5, and factor.'],
        why: 'Check: the eigenvalues add to `T = −5` and multiply to `D = 4`.' }] },

        ['Yes, because `(2, −2) = 2(1, −1)`, and any nonzero multiple of an eigenvector is one', 'Both name the same line through the origin, and the constant `C_2` absorbs the factor 2.']] },

/* PARENTHESIS SLIPS. Typing x+3/x+4 for (x + 3)/(x + 4) is the commonest typing slip, and the engine's "Reads as" line

   the forms with those parentheses dropped (top, bottom, both) become wrong answers with PAREN_MSG, unless the row
   already lists them or they are equal to the key. Nothing to write per problem. */
var PAREN_MSG = 'Without parentheses, `/` divides only the term right next to it, so the computer reads that answer differently from what you meant. Put a whole top or bottom in parentheses, as in ⟦(top)/(bottom)⟧.';
function partner(s, i, dir) {

  return -1;
}
function parenSlips(key) {

    if (s.charAt(i) !== '/') continue;

    if (a >= 0 && !/[a-z]/i.test(s.charAt(a - 1))) pairs.push([a, i - 1]);     /* a top in parentheses, not sqrt(...) */
    if (b >= 0) pairs.push([i + 1, b]);

    sets.forEach(function (set) {

/* VECTOR ROWS (Unit 10, 2026-10-26). The engine's ordered list reads "2, 1" but refuses "(2, 1)", and it cannot accept any
   multiple of an eigenvector. A vec row is judged here instead, before the engine's Check runs: the typed pair may be
   wrapped in parentheses or brackets and may follow "v =" or "A(1, 2) ="; vec: 'exact' needs both entries to match,
   vec: 'dir' accepts any nonzero multiple (and matches listed wrong answers up to a multiple too). A typed pair that is
   not two numbers gets VEC_FMT and costs no try. */
var VEC_FMT = 'Type the two entries as numbers with a comma between them, as in ⟦2, -1⟧.';
function vecParts(raw) {
  var s = String(raw).trim(), m = /=\s*([(\[].*)$/.exec(s);
  if (m) s = m[1].trim();
  if (/^[(\[⟨].*[)\]⟩]$/.test(s)) s = s.slice(1, -1);
  var ps = listParts(s);
  if (ps.length !== 2) return null;
  var vs = ps.map(function (q) { var c = mk.compile(cleanNum(q)); return c.err || !c.f ? NaN : c.f(0.7); });
  return isFinite(vs[0]) && isFinite(vs[1]) ? vs : null;
}
function vecSame(item, u, w) {
  var k = vecParts(w); if (!k) return false;
  var sc = function (p) { return Math.max(1, Math.abs(p[0]), Math.abs(p[1])); }, tol = item.tol || 1e-9;
  if (item.vec !== 'dir') return Math.abs(u[0] - k[0]) <= tol * sc(k) && Math.abs(u[1] - k[1]) <= tol * sc(k);
  var uz = Math.abs(u[0]) + Math.abs(u[1]) < 1e-12, kz = Math.abs(k[0]) + Math.abs(k[1]) < 1e-12;
  if (uz || kz) return uz && kz;
  return Math.abs(u[0] * k[1] - u[1] * k[0]) <= 1e-9 * sc(u) * sc(k);
}
function vecJudge(item, raw) {
  if (STUCK.test(String(raw)) || !String(raw).trim()) return { st: 'stuck' };
  var u = vecParts(raw), W = item.wrongs || [];
  if (!u) return { st: 'err', md: true, msg: VEC_FMT };
  if (keysOf(item).some(function (k) { return vecSame(item, u, k); })) return { st: 'ok' };
  for (var a = 0; a < W.length; a++) if (alts(W[a][0]).some(function (w) { return vecSame(item, u, w); })) return slip(W[a][1], W[a][2]);
  return { st: 'no' };
}
/* "±" IN A LIST ROW (Unit 10; PRACTICE-BRIEF.md batch-one fix). "(-5 ± 3)/2" is read as its two values. */
function pmExpand(raw) {
  var s = String(raw).replace(/\+\/-|\+-/g, '±');
  if (s.indexOf(',') >= 0 || s.split('±').length !== 2) return null;
  return s.replace('±', '+') + ', ' + s.replace('±', '-');
}
function pageJudge(item, raw) {
  if (item.vec) return vecJudge(item, raw);
  if (item.list && /±|\+\/-|\+-/.test(String(raw))) { var e = pmExpand(raw); if (e) return judge(item, e); }
  return null;
}
/* record a result the way the engine's own Check does: tries, hints, focus */
function commitResult(item, raw, r) {
  var id = item.id;
  S.ans[id] = raw; S.res[id] = r;
  if (r.st === 'ok') { S.done[id] = true; if (item.onOk) item.onOk(); }
  else if (r.st !== 'err') {
    S.tries[id] = (S.tries[id] || 0) + (r.st === 'stuck' ? 0 : 1);
    if (r.st === 'stuck' || r.st === 'no') S.hint[id] = Math.min((S.hint[id] || 0) + 1, (item.hints || []).length);
  }
  save(); redraw(item.blk);
  var f = r.st === 'ok' ? nextInput(id) : document.getElementById('in-' + id); if (f) f.focus();
}

/* MATRICES (Unit 10, 2026-10-26). [[a, b; c, d]] in a board line, task or lead becomes a 2 by 2 matrix in round brackets;
   each entry is math markup. Adapted from the trace-determinant page's matH. */
function matEntries(tok) { return tok.slice(2, -2).split(';').map(function (r) { return r.split(','); }).reduce(function (a, b) { return a.concat(b); }, []).map(function (x) { return x.trim(); }); }
function matAria(x) { return x.replace(/F\{([^}]*)\}\{([^}]*)\}/g, '$1/$2').replace(/[{}]/g, ''); }
function matH(es) {
  return '<span class="pm-mat" role="img" aria-label="' + esc('the matrix with rows ' + matAria(es[0]) + ', ' + matAria(es[1]) + ' and ' + matAria(es[2]) + ', ' + matAria(es[3])) + '"><span class="pm-mg" aria-hidden="true">' +
    es.map(function (x) { return '<span class="pm-mc">' + M(x) + '</span>'; }).join('') + '</span></span>';
}
var MAT_RE = /(\[\[[^\]]*\]\])/;
/* prose that may hold matrices */
function PX(t) { return String(t).split(MAT_RE).map(function (s, k) { return k % 2 ? matH(matEntries(s)) : P(s); }).join(''); }
/* board lines that may hold matrices: a plain line is the engine's math line; a line with a matrix is math, matrix, math */
function boardHTML(lines) {
  return '<div class="sbox multi workbox">' + lines.map(function (l) {
    if (!MAT_RE.test(l)) return L(['`' + l + '`']);
    return '<span class="mline pm-ml">' + l.split(MAT_RE).map(function (s, k) { return k % 2 ? matH(matEntries(s)) : (s.trim() ? M(s.trim()) : ''); }).join(' ') + '</span>';
  }).join('') + '</div>';
}

function stepId(p, k) { return p.id + '-' + (k + 1); }
/* register every typed row as an engine item and every choice in MCS at load, so the checks see all of them, gated or not */
function registerProblems() {
  PROBLEMS.forEach(function (p, n) {
    p.num = n + 1;
    var typedIds = [];
    p.steps.forEach(function (st, k) {
      var id = stepId(p, k);
      if (st.pick) { MCS[id] = { opts: st.pick, ok: st.ok, blk: p.id }; return; }
      if (st.show) return;
      var item = {};
      Object.keys(st).forEach(function (key) { if (['lead', 'why', 'at'].indexOf(key) < 0) item[key] = st[key]; });
      if (!item.v && p.v && !item.num) item.v = p.v;
      if (!item.teach) item.teach = p.teach;
      if (st.why) item.okNote = st.why;
      if (st.at !== undefined) item.at = st.at;
      reg(id, item, p.id);
      addParenSlips(item);
      addExpSlips(item);
      addStrays(item);
      if (!item.sol) item.sol = [solLine(item)];
      typedIds.push(id);
    });
    typedIds.forEach(function (id, k) { ITEMS[id].nextId = typedIds[k + 1] || null; });
  });
}
registerProblems();

/* is step k of problem p answered correctly? */
function stepDone(p, k) {
  var st = p.steps[k], id = stepId(p, k);
  if (st.show) return true;
  if (st.pick) return S.pick[id] === st.ok;
  return !!S.done[id];
}
function problemDone(p) { return p.steps.every(function (st, k) { return stepDone(p, k); }); }

/* the closing figure: a static plot with the page's defaults filled in */
function problemGraph(p) {
  var g = {}, d = { w: 380, h: 240, grid: true, labels: { x: p.v || 'x' } };   /* no y title: it runs into the top tick label */
  Object.keys(d).forEach(function (k) { g[k] = d[k]; });
  Object.keys(p.graph).forEach(function (k) { g[k] = p.graph[k]; });
  return figure('fig-' + p.id, plot(g), p.after);
}

/* one problem card: the board, then each step in order until the first one not yet answered */
function problemHTML(p) {
  var h = p.task ? '<p class="ptext">' + PX(p.task) + '</p>' : '';
  h += '<div class="pboard">' + boardHTML([].concat(p.board)) + '</div>';
  var open = true, lines = [];
  function flush() { if (lines.length) { h += boardHTML(lines); lines = []; } }
  for (var k = 0; k < p.steps.length && open; k++) {
    var st = p.steps[k], id = stepId(p, k);
    if (st.show) { lines = lines.concat(st.show); continue; }
    flush();
    h += '<div class="pstep' + (stepDone(p, k) ? ' ok' : '') + '">' + (st.lead ? '<p class="plead">' + PX(st.lead) + '</p>' : '');
    h += st.pick ? choice(id, st.pick, st.ok, p.id) : '<div class="srow tr fr-row' + (S.done[id] ? ' ok' : '') + '"><div class="sval">' + typed(id) + '</div></div>';
    h += '</div>';
    open = stepDone(p, k);
  }
  flush();
  if (!open) h += '<p class="locked">' + (p.steps.slice(k).some(function (st) { return !st.show; }) ? 'Answer this step to open the next one.' : 'Answer this step to finish the problem.') + '</p>';
  else if (p.graph) h += problemGraph(p);
  return card('Problem ' + p.num + (problemDone(p) ? ' · Done' : ''), h, 'ex-' + p.id, { cls: 'prob' + (problemDone(p) ? ' pdone' : '') });
}

/* FORM GUARDS. The engine judges an expression by its values, so a typed row asking for the rewritten form would accept the
   unrewritten one. Before the engine's own Check runs, a capture listener judges the answer; if the engine would call it
   correct but the row's guard rejects its form, the row shows the guard's diagnosis instead and counts a try. */
function formProblem(item, raw) {
  if (!item || (item.at === undefined && !item.form)) return null;
  if (judge(item, raw).st !== 'ok') return null;
  if (item.form) { var m = item.form(raw); if (m) return m; }
  if (item.at !== undefined) {
    var v = String(raw).indexOf('=') >= 0 ? String(raw).slice(String(raw).lastIndexOf('=') + 1) : String(raw);
    var c = mk.compile(v, vopt(item)), y = c.f ? c.f(item.at) : 0;
    if (!isFinite(y)) {

      return 'That is equal to the original, but it still gives `F{0}{0}` at `' + t + ' = ' + item.at + '`. Cancel the common factor and type what is left.';
    }

}
function formCheck(id) {

  if (pre) {   /* a stray letter: like the engine's own parse messages, it costs no try and opens no hint */
    S.ans[id] = el.value; S.res[id] = { st: 'err', msg: pre, md: true };
    save(); redraw(item.blk);
    var at = document.getElementById('in-' + id); if (at) at.focus();
    return true;
  }
  var pj = pageJudge(item, el.value);   /* Unit 10: vector rows and "±" in list rows */
  if (pj) { commitResult(item, el.value, pj); return true; }
  var m = formProblem(item, el.value); if (!m) return false;
  S.ans[id] = el.value; S.res[id] = { st: 'slip', msg: m }; S.tries[id] = (S.tries[id] || 0) + 1;
  save(); redraw(item.blk);
  var me = document.getElementById('in-' + id); if (me) me.focus();
  return true;
}
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('[data-act="check"]');
  if (b && formCheck(b.dataset.id)) { e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t && t.classList && t.classList.contains('minput') && formCheck(t.dataset.id)) { e.stopPropagation(); e.preventDefault(); }
}, true);

}

/* [item id, typed answer, should the form guard refuse it?] */
var GUARD_CASES = [];

var STRAY_CASES = [['p2-1', '9x/60 kg/min', UNITS_MSG], ['p2-1', '9x/60', null], ['p2-2', '3y/30 kg', UNITS_MSG], ['p2-2', 'y/10', null],
  ['p6-6', 'C_1*2e^(-t)+C_2e^(-4t)', 'Put in the numbers you found, `C_1 = 3` and `C_2 = −2`, so that no `C` is left.'], ['p6-7', '3e^(-t)+2e^(-4t)', null], ['p7-3', '1+4i', ALPHA_MSG], ['p7-4', '4i', BETA_MSG],

  ['p1-3', '-14, 5', 'slip'], ['p1-3', '14 -5', 'err'], ['p1-5', 'A(1, 2) = (2, 4)', 'ok'], ['p1-5', '(28, -9)', 'slip'],
  ['p5-3', '2, 1', 'ok'], ['p5-3', '(4, 2)', 'ok'], ['p5-3', '-2, -1', 'ok'], ['p5-3', '1, 0.5', 'ok'], ['p5-3', 'v_1 = (6, 3)', 'ok'], ['p5-3', '0, 0', 'slip'],
  ['p5-3', '(1, -2)', 'slip'], ['p5-3', '3, 3', 'slip'], ['p5-3', '1, 2', 'no'], ['p5-4', '(2, -2)', 'ok'], ['p5-4', '-1, 1', 'ok'], ['p5-4', '5, 5', 'slip'],
  ['p7-8', '(4, 5)', 'ok'], ['p7-8', '8, 10', 'no'], ['p5-3', '', 'stuck'], ['p5-3', 'x = 2, y = 1', 'ok']];
/* Unit 10: "±" in a list row: [item id, typed answer, status] */
var PM_CASES = [['p4-5', '(-5 ± 3)/2', 'ok'], ['p4-5', '-5/2 +- 3/2', 'ok'], ['p4-5', 'λ = (-5 ± 3)/2', 'ok'], ['p4-5', '(5 ± 3)/2', 'slip']];
/* Unit 10: an eigenvector row, a multiple of its key, typed in the live DOM: it must say Correct. */
var LIVE_VEC = { p: 'p5', id: 'p5-3', raw: '(4, 2)', says: 'Correct.' };

/* render one problem's block with that problem's progress set by fn(state), leaving S untouched */
function renderWith(p, fn) {
  var snap = selfcheck.snapshot(), html = '';
  try {
    p.steps.forEach(function (st, k) { var id = stepId(p, k); delete S.done[id]; delete S.res[id]; delete S.ans[id]; delete S.pick[id]; });
    fn();
    html = BLOCKS[p.id]();
  } finally { selfcheck.restore(snap, []); }
  return html;
}
function answerAll(p) {
  p.steps.forEach(function (st, k) {
    var id = stepId(p, k);
    if (st.pick) S.pick[id] = st.ok;
    else if (!st.show) { S.done[id] = true; S.res[id] = { st: 'ok' }; S.ans[id] = String(alts(ITEMS[id].ans)[0]); }
  });
}

selfcheck.add('steps are gated: with no progress only the first step of each problem shows', function () {
  var bad = [];
  PROBLEMS.forEach(function (p) {
    var h = renderWith(p, function () {}), first = stepId(p, 0), second = stepId(p, 1);
    var hasFirst = h.indexOf('id="mc-' + first + '"') >= 0 || h.indexOf('id="in-' + first + '"') >= 0;
    var hasSecond = h.indexOf('id="mc-' + second + '"') >= 0 || h.indexOf('id="in-' + second + '"') >= 0;
    if (!hasFirst || hasSecond) bad.push(p.id + (hasFirst ? ' shows step 2 early' : ' hides step 1'));
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: PROBLEMS.length + ' problems' };
});

selfcheck.add('a finished problem shows every step, Done and its closing figure; an unfinished one shows no figure', function () {
  var bad = [];
  PROBLEMS.forEach(function (p) {
    var done = renderWith(p, function () { answerAll(p); }), fresh = renderWith(p, function () {});
    var last = stepId(p, p.steps.length - 1), lastShown = done.indexOf('id="mc-' + last + '"') >= 0 || done.indexOf('id="in-' + last + '"') >= 0 || !!p.steps[p.steps.length - 1].show;
    if (!lastShown) bad.push(p.id + ' last step missing when answered');
    if (done.indexOf('· Done') < 0) bad.push(p.id + ' not marked Done');
    if (p.graph && done.indexOf('id="fig-' + p.id + '"') < 0) bad.push(p.id + ' figure missing when answered');
    if (fresh.indexOf('id="fig-' + p.id + '"') >= 0) bad.push(p.id + ' figure shows before the work is done');
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : true;

selfcheck.add('form guards reject equal but unrewritten answers and pass rewritten ones', function () {

  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: GUARD_CASES.length + ' cases' };

});

});

selfcheck.add('an antiderivative row accepts the answer with + C', function () {
  var rows = Object.keys(ITEMS).filter(function (id) { return ITEMS[id].upToC; });
  var bad = rows.filter(function (id) { return judge(ITEMS[id], String(ITEMS[id].ans) + ' + C').st !== 'ok'; });
  if (!rows.length) return { ok: true, detail: 'no antiderivative row on this page' };
  return bad.length ? { ok: false, detail: bad.join(', ') + ' refuse the key plus C' } : { ok: true, detail: rows.length + ' rows' };
});

/* novice read, 2026-10-26 */
selfcheck.add('stray letters get their own message, and never hide a key or a listed wrong answer', function () {
  var bad = STRAY_CASES.filter(function (c) { return strayProblem(ITEMS[c[0]], c[1]) !== c[2]; }).map(function (c) { return c[0] + ' "' + c[1] + '" -> ' + strayProblem(ITEMS[c[0]], c[1]); });
  Object.keys(ITEMS).forEach(function (id) {
    var it = ITEMS[id];
    keysOf(it).concat.apply(keysOf(it), (it.wrongs || []).map(function (w) { return alts(w[0]); })).forEach(function (a) { if (strayProblem(it, a)) bad.push(id + ' "' + a + '" is swallowed by a stray-letter message'); });
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: STRAY_CASES.length + ' cases' };
});

selfcheck.add('every typed row offers a solution after two tries', function () {
  var bad = Object.keys(ITEMS).filter(function (id) { return !ITEMS[id].isRep && !(ITEMS[id].sol && ITEMS[id].sol.length && String(ITEMS[id].sol[0]).indexOf('NaN') < 0); });
  return bad.length ? { ok: false, detail: 'no solution on ' + bad.join(', ') } : { ok: true, detail: Object.keys(ITEMS).length + ' rows' };
});

/* Unit 10, 2026-10-26 */
selfcheck.add('vector rows read typed pairs with or without parentheses, and an eigenvector row accepts any nonzero multiple', function () {
  var bad = VEC_CASES.filter(function (c) { return pageJudge(ITEMS[c[0]], c[1]).st !== c[2]; }).map(function (c) { return c[0] + ' "' + c[1] + '" -> ' + pageJudge(ITEMS[c[0]], c[1]).st + ', want ' + c[2]; });
  var rows = Object.keys(ITEMS).filter(function (id) { return ITEMS[id].vec; });
  rows.forEach(function (id) { var it = ITEMS[id];
    keysOf(it).forEach(function (k) { if (vecJudge(it, k).st !== 'ok') bad.push(id + ' key ' + k + ' refused'); if (judge(it, k).st !== 'ok') bad.push(id + ' key ' + k + ' refused by the engine'); });
    (it.wrongs || []).forEach(function (w) { alts(w[0]).forEach(function (a) { var r = vecJudge(it, a); if (r.st !== 'slip' || r.msg !== w[1]) bad.push(id + ' wrong ' + a + ' -> ' + r.st); }); }); });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: VEC_CASES.length + ' cases on ' + rows.length + ' vector rows' };
});
selfcheck.add('no listed wrong answer on an eigenvector row is a multiple of its key', function () {
  var bad = [];
  Object.keys(ITEMS).filter(function (id) { return ITEMS[id].vec === 'dir'; }).forEach(function (id) { var it = ITEMS[id], k = vecParts(it.ans);
    (it.wrongs || []).forEach(function (w) { alts(w[0]).forEach(function (a) { if (vecSame(it, k, a)) bad.push(id + ' "' + a + '"'); }); }); });
  return bad.length ? { ok: false, detail: bad.join('; ') } : true;
});
selfcheck.add('a list row reads "±" as its two values', function () {
  var bad = PM_CASES.filter(function (c) { var r = pageJudge(ITEMS[c[0]], c[1]); return !r || r.st !== c[2]; }).map(function (c) { var r = pageJudge(ITEMS[c[0]], c[1]); return c[0] + ' "' + c[1] + '" -> ' + (r ? r.st : 'not read'); });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: PM_CASES.length + ' cases' };
});
selfcheck.add('every matrix in a board, task or lead renders as a matrix', function () {
  var bad = [], n = 0;
  PROBLEMS.forEach(function (p) {
    var done = renderWith(p, function () { answerAll(p); });
    var src = [p.task].concat(p.board, p.steps.map(function (st) { return st.lead; }), [].concat.apply([], p.steps.map(function (st) { return st.show ? [].concat(st.show) : []; })));
    var want = src.filter(Boolean).reduce(function (n, x) { return n + (String(x).match(/\[\[[^\]]*\]\]/g) || []).length; }, 0);
    var got = (done.match(/class="pm-mat"/g) || []).length;
    n += got;
    if (got !== want || /\[\[/.test(done)) bad.push(p.id + ': ' + got + ' of ' + want);
  });
  return bad.length ? { ok: false, detail: bad.join('; ') } : { ok: true, detail: n + ' matrices' };
});
selfcheck.add('typing a multiple of an eigenvector and pressing Check says Correct', async function () {
  var p = PROBLEMS.filter(function (q) { return q.id === LIVE_VEC.p; })[0], snap = selfcheck.snapshot();
  var k = +LIVE_VEC.id.split('-')[1] - 1;
  answerAll(p); p.steps.slice(k).forEach(function (st, n) { var id = stepId(p, k + n); delete S.done[id]; delete S.res[id]; delete S.ans[id]; delete S.pick[id]; });
  redraw(p.id);
  var inp = document.getElementById('in-' + LIVE_VEC.id), fb = 'no input';
  if (inp) {
    inp.value = LIVE_VEC.raw; inp.dispatchEvent(new Event('input', { bubbles: true }));
    document.querySelector('[data-act="check"][data-id="' + LIVE_VEC.id + '"]').click();
    await new Promise(function (r) { setTimeout(r, 50); });
    fb = (document.getElementById('fb-' + LIVE_VEC.id) || {}).textContent || 'no feedback';
  }
  selfcheck.restore(snap, [p.id]);
  return fb.indexOf(LIVE_VEC.says) >= 0 ? true : { ok: false, detail: fb };
});
